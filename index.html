<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Dota 2: Legendary Quest</title>
    
    <link rel="preload" href="a1.jpg" as="image">
    <link rel="preload" href="a2.png" as="image">
    <link rel="preload" href="bu.mp4" as="video">
    <link rel="preload" href="Sun.mp3" as="audio">
    <link rel="preload" href="gol.mp3" as="audio">
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@900&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #ffd700; --red: #ff2a2a; --green: #4af626; --purple: #b829ff; }
        
        /* СОЧНЫЙ, ЖИВОЙ И СВЕТЛЫЙ ФОН */
        body { 
            margin: 0; 
            background: linear-gradient(45deg, #1a0b2e, #00332a, #2b0015, #110022);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: 'Roboto', sans-serif; 
            color: #fff; 
            overflow: hidden; 
            min-height: 100vh; 
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ЭКРАН ЗАГРУЗКИ */
        #start-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .overlay-content h1 { font-family: 'Cinzel', serif; font-size: 4rem; color: #fff; text-shadow: 0 0 25px var(--gold); margin-bottom: 20px; }
        
        button { background: rgba(0, 0, 0, 0.6); color: var(--gold); border: 2px solid var(--gold); padding: 15px 50px; font-family: 'Cinzel', serif; font-size: 1.5rem; cursor: pointer; border-radius: 10px; transition: 0.3s; margin-bottom: 25px; font-weight: bold; text-shadow: 0 0 10px var(--gold); box-shadow: inset 0 0 10px rgba(255, 215, 0, 0.2); }
        button:hover:not(:disabled) { background: var(--gold); color: black; box-shadow: 0 0 25px var(--gold); text-shadow: none; }
        button:disabled { border-color: #555; color: #888; cursor: not-allowed; text-shadow: none; box-shadow: none; }
        
        /* ТЕРМИНАЛ ЗАГРУЗКИ */
        #terminal { 
            width: 90%; max-width: 800px; height: 320px; background: rgba(10, 15, 20, 0.9); 
            border: 2px solid var(--green); border-radius: 8px; padding: 25px; 
            text-align: left; font-family: 'Courier New', Courier, monospace; font-size: 1.2rem; 
            color: var(--green); overflow-y: auto; box-shadow: inset 0 0 30px #000, 0 0 20px rgba(74, 246, 38, 0.3);
            line-height: 1.6;
        }
        #terminal::-webkit-scrollbar { width: 8px; }
        #terminal::-webkit-scrollbar-track { background: #111; }
        #terminal::-webkit-scrollbar-thumb { background: var(--green); border-radius: 4px; }

        .log-line { margin-bottom: 8px; opacity: 0; animation: typeLine 0.1s forwards; text-shadow: 0 0 8px var(--green); }
        @keyframes typeLine { to { opacity: 1; } }
        .log-warn { color: var(--gold); text-shadow: 0 0 8px var(--gold); font-weight: bold; }
        .log-err { color: var(--red); text-shadow: 0 0 8px var(--red); font-weight: bold; }

        /* ТРОПА И ФЛАЖКИ */
        .lane-container { position: fixed; bottom: 60px; left: 10%; width: 80%; height: 120px; z-index: 50; display: flex; align-items: center; justify-content: space-between; }
        .lane-line { position: absolute; width: 100%; height: 12px; background: rgba(0, 0, 0, 0.5); top: 50%; z-index: 1; border-radius: 6px; border: 2px solid #555; box-shadow: 0 0 10px #000; }
        
        .checkpoint { width: 10px; height: 45px; background: #333; z-index: 2; transition: 0.3s; position: relative; border-radius: 3px; border: 1px solid #000; }
        .checkpoint::before { content: ''; position: absolute; top: -16px; left: 0; width: 26px; height: 16px; background: var(--red); display: none; clip-path: polygon(0 0, 100% 50%, 0 100%); filter: drop-shadow(0 0 5px var(--red)); }
        .checkpoint.active { background: var(--gold); box-shadow: 0 0 20px var(--gold); border-color: #fff; }
        .checkpoint.active::before { display: block; }
        
        /* СИММЕТРИЧНЫЙ ЗАМОК */
        .lock { width: 38px; height: 30px; background: var(--gold); border-radius: 6px; position: relative; box-shadow: 0 0 25px var(--gold); z-index: 2; display: flex; justify-content: center; align-items: center; }
        .lock::before { content: ''; position: absolute; width: 20px; height: 18px; border: 6px solid var(--gold); border-bottom: none; border-radius: 16px 16px 0 0; top: -18px; left: 50%; transform: translateX(-50%); box-sizing: border-box; }
        .lock::after { content: ''; width: 8px; height: 12px; background: #000; border-radius: 4px; }

        /* ЭЛЬФ (ОДИН АВАТАР) */
        .elf-avatar { 
            position: absolute; width: 60px; height: 60px; 
            z-index: 20; transition: left 0.8s ease-in-out;
            display: flex; align-items: center; justify-content: center; 
            font-size: 40px; filter: drop-shadow(0 0 15px var(--gold));
            /* БЕГ НА МЕСТЕ */
            animation: runInPlace 0.4s infinite alternate ease-in-out;
            cursor: pointer;
        }
        @keyframes runInPlace {
            0% { transform: translateY(0) rotate(-5deg); }
            100% { transform: translateY(-10px) rotate(5deg); }
        }
        /* АНИМАЦИЯ ПРЫЖКА (ПЕРЕОПРЕДЕЛЯЕТ БЕГ) */
        .elf-jump {
            animation: elfJump 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards !important;
        }
        @keyframes elfJump {
            0% { transform: translateY(0) scale(1) rotate(0); }
            50% { transform: translateY(-80px) scale(1.3) rotate(15deg); }
            100% { transform: translateY(0) scale(1) rotate(0); }
        }
        
        /* ТУЛТИП ДЛЯ ЭЛЬФА */
        .tooltip { 
            visibility: hidden; width: 300px; background-color: rgba(0,0,0,0.9); 
            color: var(--gold); text-align: center; border-radius: 12px; padding: 15px; 
            position: absolute; z-index: 100; bottom: 120%; left: 50%; transform: translateX(-50%);
            font-size: 18px; border: 2px solid var(--gold); box-shadow: 0 0 20px var(--gold); 
            opacity: 0; transition: opacity 0.3s; font-family: 'Roboto', sans-serif;
        }
        .elf-avatar:hover .tooltip { visibility: visible; opacity: 1; }

        /* ЯРКИЕ ФОТО БЕЗ ТЕМНОГО ФОНА */
        .falling-photo { position: fixed; z-index: 1; pointer-events: none; opacity: 0; will-change: transform, top, left; filter: drop-shadow(0 0 15px rgba(0,0,0,0.5)); border-radius: 10px; }
        
        /* КОНТЕНТ В ЦЕНТРЕ */
        .content { 
            position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%); 
            z-index: 10; width: 90%; max-width: 800px; text-align: center; display: none; 
        }
        
        /* ВЫРАЗИТЕЛЬНОЕ ОКОШКО ВОПРОСА (GLASSMORPHISM) */
        .step { 
            background: rgba(20, 5, 30, 0.75); padding: 50px; 
            border-radius: 20px; border: 3px solid var(--gold); margin-top: 20px; 
            display: none; transform-origin: center center;
            backdrop-filter: blur(12px); /* Эффект стекла */
            transition: box-shadow 0.05s ease-out, transform 0.05s ease-out, border-color 0.05s ease-out; 
        }
        .step.active { display: block; animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        
        .step p { font-size: 2.2rem; margin-bottom: 40px; color: #fff; line-height: 1.4; text-shadow: 0 0 10px rgba(0,0,0,0.8); font-weight: bold; }
        
        /* ПОЛЯ ВВОДА И КНОПКИ */
        input { 
            width: 100%; padding: 20px; background: rgba(0, 0, 0, 0.6); border: 2px solid var(--gold); 
            color: var(--gold); border-radius: 10px; margin-bottom: 30px; 
            font-size: 1.8rem; text-align: center; box-sizing: border-box; transition: 0.3s;
            font-weight: bold; box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }
        input:focus { outline: none; border-color: #fff; background: rgba(0, 0, 0, 0.8); box-shadow: 0 0 20px var(--gold); }
        input::placeholder { color: #888; font-weight: normal; }
        input:disabled { opacity: 0.7; cursor: not-allowed; }

        /* ЭФФЕКТЫ ОТВЕТОВ */
        .shake { animation: shake 0.4s; border-color: var(--red) !important; box-shadow: 0 0 25px var(--red) !important; }
        @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-15px);} 50% {transform: translateX(15px);} 75% {transform: translateX(-15px);} }
        .success-glow { border-color: var(--green) !important; box-shadow: 0 0 40px var(--green), inset 0 0 20px var(--green) !important; color: var(--green); }
        
        /* KILL FEED */
        .kill-feed {
            position: fixed; z-index: 5; font-family: 'Cinzel', serif; font-size: 1.8rem; font-weight: bold;
            color: white; text-shadow: 2px 2px 5px black, 0 0 15px rgba(0,0,0,1);
            background: linear-gradient(90deg, rgba(0, 0, 0, 0.9), transparent); border-left: 6px solid var(--red);
            padding: 15px 30px; border-radius: 4px; pointer-events: none; opacity: 0;
            white-space: nowrap; animation: killFeedAnim 5s ease-in-out forwards;
        }
        @keyframes killFeedAnim {
            0% { opacity: 0; transform: translateY(30px) scale(0.8); }
            10% { opacity: 1; transform: translateY(0) scale(1.1); }
            15% { transform: scale(1); }
            80% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-30px); }
        }

        /* МЕДИА СЮРПРИЗЫ */
        .reveal-media { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 100px; height: 100px; z-index: 10000; opacity: 0; 
            transition: all 1.5s ease-in-out; border: 5px solid var(--gold); display: none; 
            background-color: #000; object-fit: contain; pointer-events: none; border-radius: 15px;
        }
        .reveal-media.expanded { width: 100vw; height: 100vh; opacity: 1; border-width: 0; border-radius: 0; }
        @keyframes moveLR { from { left: -600px; transform: rotate(-5deg); } to { left: 110vw; transform: rotate(5deg); } }
        @keyframes moveTB { from { top: -600px; transform: rotate(-5deg); } to { top: 110vh; transform: rotate(5deg); } }
        @keyframes moveRL { from { left: 110vw; transform: rotate(5deg); } to { left: -600px; transform: rotate(-5deg); } }
        @keyframes moveBT { from { top: 110vh; transform: rotate(5deg); } to { top: -600px; transform: rotate(-5deg); } }
    </style>
</head>
<body>

    <div id="start-overlay">
        <div class="overlay-content">
            <h1>Congrats Илья and Алиса<br>happy birthday</h1>
            <button id="start-btn" disabled onclick="startExperience()">Вперед (60)</button>
            <div id="terminal"></div>
        </div>
    </div>

    <!-- МУЗЫКА И МЕДИА -->
    <audio id="audio" preload="auto"></audio>
    <img id="reveal-img-1" class="reveal-media" src="a1.jpg" loading="eager">
    <img id="reveal-img-2" class="reveal-media" src="a2.png" loading="eager">
    <video id="reveal-vid-3" class="reveal-media" src="bu.mp4" preload="auto"></video>

    <div class="lane-container" id="progress">
        <div class="lane-line"></div>
        <div class="checkpoint active"></div><div class="checkpoint"></div><div class="checkpoint"></div>
        <div class="checkpoint"></div><div class="checkpoint"></div><div class="checkpoint"></div>
        <div class="checkpoint"></div><div class="checkpoint"></div><div class="checkpoint"></div>
        <div class="checkpoint"></div>
        
        <div class="lock"></div>
        
        <!-- ЭЛЬФ -->
        <div class="elf-avatar" id="avatar-elf" style="left: 0%;">
            🧝‍♂️🏹👟
            <div class="tooltip">Эльф-скороход готов к фарму!</div>
        </div>
    </div>

    <div class="content" id="main-content">
        <div id="quiz-area"></div>
    </div>

    <script>
        /* === КЭШ === */
        const audio = document.getElementById('audio');
        const elf = document.getElementById('avatar-elf');
        
        /* === ЛОГИКА ТЕРМИНАЛА ЗАГРУЗКИ === */
        const terminalLogs = [
            "[SYS] Инициализация тайного лобби...",
            "[SYS] Подключение к серверам Dota 2...",
            "[SYS] Анализ пинга... 999 мс. Играбельно.",
            "<span class='log-err'>[ERROR] Илья снова ферст-пикнул Techies. Команда пишет 'GG' до выхода крипов.</span>",
            "[WAIT] Расстановка мин по всему лесу. Лесник плачет в углу...",
            "<span class='log-warn'>[OK] Алиса взяла Witch Doctor. Ситуация под контролем.</span>",
            "[WAIT] Брошен кокос! Летит... летит... отскок в лесного крипа. Классика.",
            "<span class='log-err'>[ERROR] Вражеский Пудж хукнул крипа. Снова.</span>",
            "[SYS] Оооояяяяя! Загрузка касочек... Эффективность хила 146%.",
            "<span class='log-err'>[ERROR] Илья заминировал Рошпит. Сервер лагает от количества бочек.</span>",
            "<span class='log-warn'>[INFO] Антон пытается затащить эту катку. Шансы: 3%.</span>",
            "[SYS] Поиск команды... Найдены 4 подпиваса.",
            "[WAIT] Алиса ставит Death Ward (WUB WUB WUB). Раздаются крики врагов.",
            "<span class='log-warn'>[INFO] Илья делает суицид (Blast Off!) в толпу. Никто не умер, но было эффектно.</span>",
            "[SYS] Покупка вардов... Ошибка: саппорты покупают Аганим.",
            "[WAIT] Илья ставит табличку 'Осторожно, мины'. Враги думают, что это блеф... Зря.",
            "[OK] Подключение к голосовому чату. Обнаружены неадекваты. Мут всех.",
            "[WAIT] Алиса хилит команду... Команда с криками убегает от хила.",
            "<span class='log-warn'>[SYS] Сканирование таверны... Там подозрительно много наших.</span>",
            "<span class='log-err'>[ERROR] Минёр в команде = игра на 2 часа. Заказывайте пиццу.</span>",
            "[SYS] Габен забирает ваши MMR... Успешно.",
            "[SYS] Вражеский керри наступил на красную мину. Минус нервы.",
            "[WAIT] Алиса спамит 'Look at it go!'. Мораль команды повышена.",
            "[SYS] Синхронизация общих воспоминаний...",
            "<span class='log-warn'>[OK] Проверка файлов завершена. Защита активна.</span>",
            "<span class='log-warn'>[SYS] Готовность 100%. Нажмите ВПЕРЕД, чтобы начать.</span>"
        ];
        
        const terminal = document.getElementById('terminal');
        let logIndex = 0;
        const logTimer = setInterval(() => {
            if (logIndex < terminalLogs.length) {
                const line = document.createElement('div');
                line.className = 'log-line';
                line.innerHTML = terminalLogs[logIndex];
                terminal.appendChild(line);
                terminal.scrollTop = terminal.scrollHeight;
                logIndex++;
            } else {
                clearInterval(logTimer);
            }
        }, 2200);

        /* === ТАЙМЕР СТАРТА === */
        let timeLeft = 60;
        const startBtn = document.getElementById('start-btn');
        const timerInterval = setInterval(() => {
            timeLeft--;
            startBtn.innerText = `Вперед (${timeLeft})`;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                startBtn.disabled = false;
                startBtn.innerText = "Вперед";
                startBtn.style.transform = "scale(1.1)";
            }
        }, 1000);

        /* === KILL FEED === */
        const killFeedTexts = [
            "<span style='color: var(--red);'>FIRST BLOOD!</span> Алиса застилила фраг у керри.",
            "<span style='color: var(--red);'>FIRST BLOOD!</span> Илья сделал суицид в лесных крипов.",
            "<span style='color: var(--gold);'>DOUBLE KILL!</span> Илья подорвал курьера с чужими шмотками.",
            "<span style='color: var(--gold);'>DOUBLE KILL!</span> Вард Алисы сделал больше фрагов, чем кор.",
            "<span style='color: var(--red);'>TRIPLE KILL!</span> Кокос Алисы бесконечно скачет по троим.",
            "<span style='color: #ffaa00;'>WICKED SICK!</span> Антон сгорел в войс-чат!",
            "<span style='color: #00ffff;'>MONSTER KILL!</span> Вражеский мидер разбивает шмотки.",
            "<span style='color: var(--purple);'>RAMPAGE!</span> Илья заминировал фонтан и взорвал всю команду!",
            "<span style='color: var(--purple);'>RAMPAGE!</span> Илья нажал одну кнопку. Минус 5.",
            "<span style='color: #ffaa00;'>GODLIKE!</span> Алиса выхилила тимейта с 1 ХП.",
            "<span style='color: #00ffff;'>HOLY SHIT!</span> Илья купил Рапиру на Минёра!",
            "<span style='color: #00ffff;'>HOLY SHIT!</span> Команда противника удалила Доту.",
            "<span style='color: var(--red);'>DOMINATING!</span> Алиса закинула кокос в Рошпит. Рошан в стане.",
            "<span style='color: #ffaa00;'>UNSTOPPABLE!</span> Илья ставит зеленую мину прямо в файте.",
            "<span style='color: var(--gold);'>MEGA KILL!</span> Антон купил гем, но умер через секунду.",
            "<span style='color: var(--red);'>OWNAGE!</span> Враги ливнули из-за мин в лесу."
        ];

        function spawnKillFeed() {
            const feed = document.createElement('div');
            feed.className = 'kill-feed';
            feed.innerHTML = killFeedTexts[Math.floor(Math.random() * killFeedTexts.length)];
            
            const zone = Math.floor(Math.random() * 4);
            let t, l;
            if (zone === 0) { t = Math.random() * 5 + 5; l = Math.random() * 40 + 10; } 
            else if (zone === 1) { t = Math.random() * 5 + 85; l = Math.random() * 40 + 10; } 
            else if (zone === 2) { t = Math.random() * 40 + 20; l = Math.random() * 5 + 2; } 
            else { t = Math.random() * 40 + 20; l = Math.random() * 5 + 65; } 
            
            feed.style.top = t + 'vh';
            feed.style.left = l + 'vw';
            
            document.body.appendChild(feed);
            feed.addEventListener('animationend', () => feed.remove());
        }

        /* === МУЗЫКА И ФОТО === */
        // Sun.mp3 ТЕПЕРЬ ПЕРВЫЙ В СПИСКЕ!
        const playlist = ["Sun.mp3", "porno.mp3", "Bullet.mp3", "london.mp3", "ak47.mp3", "paparoach.mp3", "Gorillaz.mp3"];
        let currentTrack = 0;
        let isSpecialAudioPlaying = false; 

        function changeTrackWithFade() {
            if (isSpecialAudioPlaying) return; 
            let fadeOut = setInterval(() => {
                if (audio.volume > 0.02) { audio.volume -= 0.02; } 
                else {
                    audio.volume = 0;
                    clearInterval(fadeOut);
                    currentTrack = (currentTrack + 1) % playlist.length;
                    audio.src = playlist[currentTrack];
                    audio.play();
                    let fadeIn = setInterval(() => {
                        if (audio.volume < 0.13) { audio.volume += 0.02; } 
                        else { audio.volume = 0.15; clearInterval(fadeIn); }
                    }, 100);
                }
            }, 100);
        }
        audio.addEventListener('ended', changeTrackWithFade);

        let animDirection = 0;
        setInterval(() => { animDirection = (animDirection + 1) % 4; }, 10000); 

        let currentPhotoIndex = 1;
        let isRandomPhotos = false;

        function spawnPhoto() {
            let i;
            if (!isRandomPhotos) {
                i = currentPhotoIndex++;
                if (currentPhotoIndex > 31) isRandomPhotos = true; 
            } else {
                i = Math.floor(Math.random() * 31) + 1;
            }

            const img = document.createElement('img');
            img.src = `p${i}.jpg`;
            img.className = 'falling-photo';
            // Фотки теперь огромные и крутые!
            img.style.width = (Math.floor(Math.random() * 500) + 400) + 'px'; 
            
            let animName = '';
            if (animDirection === 0) { img.style.top = (Math.random() * 80) + 'vh'; animName = 'moveLR'; } 
            else if (animDirection === 1) { img.style.left = (Math.random() * 90) + 'vw'; animName = 'moveTB'; } 
            else if (animDirection === 2) { img.style.top = (Math.random() * 80) + 'vh'; animName = 'moveRL'; } 
            else if (animDirection === 3) { img.style.left = (Math.random() * 90) + 'vw'; animName = 'moveBT'; }

            document.body.appendChild(img);
            setTimeout(() => {
                // Фото стали ярче (opacity: 0.85)
                img.style.animation = `${animName} ${Math.random() * 6 + 8}s linear`;
                img.style.opacity = '0.85'; 
            }, 50);
            img.addEventListener('animationend', () => img.remove());
        }

        /* === ВОПРОСЫ === */
        let currentStep = 1;
        const quizData = [
            { q: "Кто озвучивает фразу 'я люблю когда гмом'?", a: ["анастасия", "настя", "настена"] },
            { q: "Как ты обычно с нами здороваешься, когда заходишь?", a: ["привет", "привет ребята", "привет, ребята"] },
            { q: "В каком году был первый матч Антона с Алисой?", a: ["2024"] },
            { q: "Вопрос 4", a: ["ответ4"] },
            { q: "Вопрос 5", a: ["ответ5"] },
            { q: "Вопрос 6", a: ["ответ6"] },
            { q: "Вопрос 7", a: ["ответ7"] },
            { q: "Вопрос 8", a: ["ответ8"] },
            { q: "Вопрос 9", a: ["ответ9"] },
            { q: "Вопрос 10", a: ["ответ10"] }
        ];

        const quizArea = document.getElementById('quiz-area');
        quizData.forEach((item, index) => {
            const stepDiv = document.createElement('div');
            stepDiv.className = 'step';
            stepDiv.id = 'step' + (index + 1);
            if(index === 0) stepDiv.classList.add('active');
            
            stepDiv.innerHTML = `
                <p>${item.q}</p>
                <input type="text" id="answer${index + 1}" placeholder="Ваш ответ..." 
                       onkeydown="if(event.key === 'Enter') checkAnswer(${index + 1})" autofocus>
                <button class="submit-btn" onclick="checkAnswer(${index + 1})">Проверить</button>
            `;
            quizArea.appendChild(stepDiv);
        });

        /* === ЯРКИЙ МНОГОЦВЕТНЫЙ АУДИО ВИЗУАЛИЗАТОР === */
        let audioCtx, analyser, dataArray;
        function initVisualizer() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioCtx.createMediaElementSource(audio);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                visualizeLoop();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function visualizeLoop() {
            requestAnimationFrame(visualizeLoop);
            if (!analyser) return;
            analyser.getByteFrequencyData(dataArray);

            let deepBassAvg = (dataArray[1] + dataArray[2] + dataArray[3] + dataArray[4] + dataArray[5]) / 5; 
            let midBassAvg = 0;
            for(let i = 6; i <= 15; i++) midBassAvg += dataArray[i];
            midBassAvg /= 10;

            const activeStep = document.querySelector('.step.active');
            if (activeStep) {
                if (deepBassAvg < 15 && midBassAvg < 15) {
                    activeStep.style.boxShadow = `0 0 30px rgba(0,0,0,0.5)`;
                    activeStep.style.transform = `scale(1)`;
                    activeStep.style.borderColor = `var(--gold)`;
                } else {
                    const intensity = Math.pow(deepBassAvg / 255, 1.2); 
                    const midIntensity = Math.pow(midBassAvg / 255, 1.2);

                    const scale = 1 + (intensity * 0.05); 
                    
                    // ЦВЕТА ДОТЫ: ЯРКО-ЗОЛОТОЙ, ЗЕЛЕНЫЙ (RADIANT), ПУРПУРНЫЙ/КРАСНЫЙ (DIRE)
                    const coreGlow = 10 + (intensity * 20); 
                    const midGlow = 30 + (midIntensity * 50); 
                    const outerGlow = 60 + (intensity * 100); 

                    activeStep.style.boxShadow = `
                        0 0 ${coreGlow}px rgba(255, 255, 255, ${0.6 + intensity * 0.4}), 
                        0 0 ${midGlow}px rgba(74, 246, 38, ${0.5 + midIntensity * 0.5}), 
                        0 0 ${outerGlow}px rgba(184, 41, 255, ${0.4 + intensity * 0.6}),
                        inset 0 0 ${20 + intensity * 30}px rgba(255, 215, 0, ${0.3 + intensity * 0.5})
                    `;
                    activeStep.style.transform = `scale(${scale})`;
                    activeStep.style.borderColor = `rgba(255, 215, 0, ${0.8 + intensity})`;
                }
            }
        }

        /* === СТАРТ === */
        function startExperience() {
            audio.volume = 0.15;
            audio.src = playlist[currentTrack];
            audio.play(); 
            initVisualizer();

            document.getElementById('start-overlay').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            
            setTimeout(() => document.getElementById('answer1').focus(), 100);
            
            setInterval(spawnPhoto, 1800); 
            setInterval(spawnKillFeed, 5500);
        }

        /* === УНИВЕРСАЛЬНЫЙ ОБРАБОТЧИК МЕДИА === */
        function playMediaEvent(mediaId, audioFile, duration = null) {
            isSpecialAudioPlaying = true;
            audio.pause();

            const media = document.getElementById(mediaId);
            let specialAudio = null;

            if (audioFile) {
                specialAudio = new Audio(audioFile);
                specialAudio.play();
            } else if (media.tagName === 'VIDEO') {
                media.play();
            }

            media.style.display = 'block';
            setTimeout(() => media.classList.add('expanded'), 50);

            const onEnd = () => {
                if (specialAudio) { specialAudio.pause(); specialAudio.currentTime = 0; }
                if (media.tagName === 'VIDEO') { media.pause(); media.currentTime = 0; }
                
                media.classList.remove('expanded');
                setTimeout(() => { media.style.display = 'none'; }, 1000); 
                
                audio.volume = 0.15;
                audio.play();
                isSpecialAudioPlaying = false;
                nextStep();
            };

            if (duration) {
                setTimeout(onEnd, duration);
            } else if (specialAudio) {
                specialAudio.onended = onEnd;
            } else if (media.tagName === 'VIDEO') {
                media.onended = onEnd;
            }
        }

        /* === ПРОВЕРКА ОТВЕТА === */
        async function checkAnswer(step) {
            if (isSpecialAudioPlaying) return; 

            const inputField = document.getElementById('answer' + step);
            const submitBtn = inputField.nextElementSibling;
            const val = inputField.value.toLowerCase().trim();
            
            if (quizData[step-1].a.includes(val)) {
                inputField.classList.add('success-glow');
                inputField.disabled = true;
                submitBtn.disabled = true;
                
                setTimeout(() => {
                    inputField.value = ''; 
                    inputField.classList.remove('success-glow');
                    inputField.disabled = false;
                    submitBtn.disabled = false;

                    if (step === 1) {
                        playMediaEvent('reveal-img-1', 'gol.mp3');
                    } else if (step === 2) {
                        playMediaEvent('reveal-img-2', 'Privet.mp3', 4000); 
                    } else if (step === 3) {
                        playMediaEvent('reveal-vid-3', null);
                    } else {
                        nextStep();
                    }
                }, 300);
            } else { 
                inputField.classList.add('shake');
                setTimeout(() => inputField.classList.remove('shake'), 400);
            }
        }

        /* === ПЕРЕХОД НА СЛЕДУЮЩИЙ ШАГ (ПРЫЖОК ЭЛЬФА) === */
        function nextStep() {
            const oldStep = document.getElementById('step' + currentStep);
            oldStep.style.display = 'none';
            oldStep.classList.remove('active'); 
            
            currentStep++;
            
            if (currentStep <= 10) {
                const newStep = document.getElementById('step' + currentStep);
                newStep.classList.add('active'); 
                
                setTimeout(() => document.getElementById('answer' + currentStep).focus(), 100);
                
                const pos = (currentStep - 1) * 10;
                
                // ЭЛЬФ ДЕЛАЕТ ПРЫЖОК
                elf.classList.add('elf-jump');
                elf.style.left = pos + '%';
                
                setTimeout(() => {
                    elf.classList.remove('elf-jump');
                }, 800);
                
                const flags = document.querySelectorAll('.checkpoint');
                flags[currentStep - 1].classList.add('active');
            } else {
                elf.classList.add('elf-jump');
                elf.style.left = '100%';
                
                setTimeout(() => {
                    elf.classList.remove('elf-jump');
                    alert("GG WP! Защита снята. Код: 732");
                }, 800);
            }
        }
    </script>
