<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Dota 2: Legendary Quest</title>
    
    <link rel="preload" href="a1.jpg" as="image">
    <link rel="preload" href="a2.png" as="image">
    <link rel="preload" href="bu.mp4" as="video">
    <link rel="preload" href="Sun.mp3" as="audio">
    <link rel="preload" href="gol.mp3" as="audio">
    
    <!-- Подключаем только чистые, красивые шрифты -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #e5c07b; --red: #c23c2a; --green: #4af626; --purple: #b829ff; --matrix-green: #0f0; }
        
        /* РОСКОШНЫЙ КОСМИЧЕСКИ-МИСТИЧЕСКИЙ ФОН */
        body { 
            margin: 0; 
            /* Глубокий, органичный градиент: ночной индиго, насыщенный фиолетовый, темный синий */
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            background-size: 200% 200%;
            animation: calmGradient 20s ease infinite;
            font-family: 'Roboto', sans-serif; 
            color: #fff; 
            overflow: hidden; 
            min-height: 100vh; 
        }
        @keyframes calmGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ЭКРАН ЗАГРУЗКИ С МАТРИЦЕЙ */
        #start-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; overflow: hidden; }
        #matrix-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        
        .overlay-content { z-index: 1; display: flex; flex-direction: column; align-items: center; width: 100%; }
        .overlay-content h1 { font-family: 'Cinzel', serif; font-size: 4rem; color: #fff; text-shadow: 0 0 20px var(--gold); margin-bottom: 20px; }
        
        button { background: rgba(0,0,0,0.8); color: var(--gold); border: 2px solid var(--gold); padding: 15px 50px; font-family: 'Cinzel', serif; font-size: 1.5rem; cursor: pointer; border-radius: 10px; transition: 0.3s; margin-bottom: 25px; font-weight: bold; }
        button:hover:not(:disabled) { background: var(--gold); color: black; box-shadow: 0 0 20px var(--gold); }
        button:disabled { border-color: #555; color: #666; cursor: not-allowed; }
        
        /* ХАКЕРСКИЙ ТЕРМИНАЛ ЗАГРУЗКИ */
        #terminal { 
            width: 90%; max-width: 800px; height: 320px; background: rgba(0, 10, 0, 0.85); 
            border: 1px solid var(--matrix-green); border-radius: 8px; padding: 25px; 
            text-align: left; font-family: 'Courier New', Courier, monospace; font-size: 1.2rem; 
            color: var(--matrix-green); overflow-y: auto; box-shadow: inset 0 0 20px #000, 0 0 15px rgba(0, 255, 0, 0.2);
            line-height: 1.6;
        }
        #terminal::-webkit-scrollbar { width: 8px; }
        #terminal::-webkit-scrollbar-track { background: #000; }
        #terminal::-webkit-scrollbar-thumb { background: #0f0; border-radius: 4px; }

        .log-line { margin-bottom: 8px; opacity: 0; animation: typeLine 0.1s forwards; }
        @keyframes typeLine { to { opacity: 1; } }
        .log-warn { color: #aff; font-weight: bold; text-shadow: 0 0 5px #aff; }
        .log-err { color: #fff; background: #080; padding: 0 5px; font-weight: bold; }

        /* ТРОПА И ФЛАЖКИ */
        .lane-container { position: fixed; bottom: 60px; left: 10%; width: 80%; height: 120px; z-index: 50; display: flex; align-items: center; justify-content: space-between; }
        .lane-line { position: absolute; width: 100%; height: 8px; background: rgba(0, 0, 0, 0.6); top: 50%; z-index: 1; border-radius: 4px; border: 1px solid #222; }
        
        .checkpoint { width: 8px; height: 35px; background: #222; z-index: 2; transition: 0.3s; position: relative; border-radius: 2px; }
        .checkpoint::before { content: ''; position: absolute; top: -14px; left: 0; width: 20px; height: 12px; background: var(--red); display: none; clip-path: polygon(0 0, 100% 50%, 0 100%); }
        .checkpoint.active { background: var(--gold); box-shadow: 0 0 15px var(--gold); }
        .checkpoint.active::before { display: block; }
        
        /* СИММЕТРИЧНЫЙ ЗАМОК */
        .lock { width: 34px; height: 26px; background: var(--gold); border-radius: 6px; position: relative; box-shadow: 0 0 20px var(--gold); z-index: 2; display: flex; justify-content: center; align-items: center; }
        .lock::before { content: ''; position: absolute; width: 18px; height: 16px; border: 5px solid var(--gold); border-bottom: none; border-radius: 14px 14px 0 0; top: -16px; left: 50%; transform: translateX(-50%); box-sizing: border-box; }
        .lock::after { content: ''; width: 6px; height: 10px; background: #0d1117; border-radius: 3px; }

        /* КАПИБАРА CSS ART */
        .capybara-container { 
            position: absolute; width: 50px; height: 40px; 
            z-index: 20; transition: left 0.8s ease-in-out;
            cursor: pointer; top: 15px;
            display: flex; justify-content: center; align-items: center;
        }
        
        .capybara {
            width: 38px; height: 24px;
            background: #8b5a2b; 
            border-radius: 12px 18px 12px 8px;
            position: relative;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.8);
        }
        .capybara::before { 
            content: ''; position: absolute;
            width: 3px; height: 3px; background: #000;
            border-radius: 50%; top: 6px; right: 8px;
            box-shadow: 7px 5px 0 -1px #3d2314;
        }
        .capybara::after { 
            content: ''; position: absolute;
            width: 6px; height: 5px; background: #4a2e12;
            border-radius: 50%; top: -2px; right: 12px;
        }
        .capybara-legs {
            position: absolute; bottom: -5px; left: 6px;
            width: 4px; height: 7px; background: #4a2e12;
            border-radius: 2px;
            box-shadow: 16px 0 0 #4a2e12;
        }

        .capy-running { animation: capyRun 0.4s infinite alternate ease-in-out; }
        @keyframes capyRun {
            0% { transform: translateY(0) rotate(-3deg); }
            100% { transform: translateY(-5px) rotate(3deg); }
        }

        .capy-jump { animation: capyJump 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards !important; }
        @keyframes capyJump {
            0% { transform: translateY(0) scale(1) rotate(0); }
            50% { transform: translateY(-70px) scale(1.1) rotate(10deg); }
            100% { transform: translateY(0) scale(1) rotate(0); }
        }

        .tooltip { 
            visibility: hidden; width: 280px; background-color: rgba(0,0,0,0.9); 
            color: var(--gold); text-align: center; border-radius: 8px; padding: 12px; 
            position: absolute; z-index: 100; bottom: 120%; left: 50%; transform: translateX(-50%);
            font-size: 16px; border: 1px solid var(--gold); box-shadow: 0 0 15px var(--gold); 
            opacity: 0; transition: opacity 0.3s; font-family: 'Roboto', sans-serif;
        }
        .capybara-container:hover .tooltip { visibility: visible; opacity: 1; }

        /* ОГРОМНЫЕ ФОТОГРАФИИ "В ПОЕЗДЕ" */
        .falling-photo { 
            position: fixed; z-index: 1; pointer-events: none; opacity: 0; 
            width: 520px; 
            border-radius: 12px; box-shadow: 0 0 30px rgba(0,0,0,0.8);
            animation: moveTrain 35s linear forwards;
        }
        @keyframes moveTrain {
            0% { transform: translateX(110vw); opacity: 0; }
            5% { opacity: 0.25; } 
            95% { opacity: 0.25; }
            100% { transform: translateX(-600px); opacity: 0; }
        }

        /* КРАСИВАЯ БЕГУЩАЯ СТРОКА НА ВСЮ ШИРИНУ */
        #marquee-container {
            position: fixed; top: 30px; left: 0; width: 100vw; z-index: 15;
            overflow: hidden; pointer-events: none; display: none;
            background: rgba(0, 0, 0, 0.4); /* Легкая подложка для читаемости */
            padding: 10px 0;
            border-top: 1px solid rgba(229, 192, 123, 0.2);
            border-bottom: 1px solid rgba(229, 192, 123, 0.2);
        }
        .marquee-text {
            display: inline-block; white-space: nowrap;
            /* Используем строгий, прямой и величественный шрифт, заглавными буквами */
            font-family: 'Cinzel', serif; font-size: 2.2rem; font-weight: 900; letter-spacing: 4px; text-transform: uppercase;
            color: var(--gold); text-shadow: 0 0 15px var(--gold);
            animation: marqueeScroll 18s linear infinite;
        }
        @keyframes marqueeScroll {
            0% { transform: translateX(100vw); }
            100% { transform: translateX(-100%); }
        }
        
        /* КОНТЕНТ В ЦЕНТРЕ */
        .content { 
            position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%); 
            z-index: 10; width: 90%; max-width: 800px; text-align: center; display: none; 
        }
        
        /* ОКОШКО ВОПРОСА */
        .step { 
            background: rgba(10, 12, 18, 0.85); padding: 45px; 
            border-radius: 15px; border: 2px solid #333; margin-top: 20px; 
            display: none; transform-origin: center center;
            backdrop-filter: blur(8px);
            transition: box-shadow 0.05s ease-out, transform 0.05s ease-out, border-color 0.05s ease-out; 
        }
        .step.active { display: block; animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        
        .step p { font-size: 1.8rem; margin-bottom: 35px; color: #fff; line-height: 1.4; text-shadow: 0 0 10px rgba(0,0,0,0.8); font-weight: bold; }
        
        /* ПОЛЯ ВВОДА И КНОПКИ */
        input { 
            width: 100%; padding: 18px; background: rgba(0, 0, 0, 0.6); border: 2px solid #555; 
            color: #fff; border-radius: 8px; margin-bottom: 25px; 
            font-size: 1.6rem; text-align: center; box-sizing: border-box; transition: 0.3s;
        }
        input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 15px rgba(229, 192, 123, 0.3); }
        input::placeholder { color: #666; font-weight: normal; }
        input:disabled { opacity: 0.7; cursor: not-allowed; }

        .shake { animation: shake 0.4s; border-color: var(--red) !important; box-shadow: 0 0 20px var(--red) !important; }
        @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-15px);} 50% {transform: translateX(15px);} 75% {transform: translateX(-15px);} }
        .success-glow { border-color: var(--green) !important; box-shadow: 0 0 25px var(--green), inset 0 0 15px var(--green) !important; color: var(--green); }
        
        .submit-btn { 
            width: 100%; padding: 18px; background: var(--red); color: white; border: none; 
            cursor: pointer; font-family: 'Cinzel', serif; font-size: 1.5rem; 
            border-radius: 8px; transition: 0.3s;
        }
        .submit-btn:hover:not(:disabled) { background: var(--gold); color: black; transform: scale(1.02); }

        /* KILL FEED */
        .kill-feed {
            position: fixed; z-index: 5; font-family: 'Cinzel', serif; font-size: 1.5rem; font-weight: bold;
            color: white; text-shadow: 2px 2px 5px black, 0 0 15px rgba(0,0,0,1);
            background: linear-gradient(90deg, rgba(0, 0, 0, 0.8), transparent); border-left: 4px solid var(--red);
            padding: 12px 30px; border-radius: 4px; pointer-events: none; opacity: 0;
            white-space: nowrap; animation: killFeedAnim 6s ease-in-out forwards;
        }
        @keyframes killFeedAnim {
            0% { opacity: 0; transform: translateY(20px) scale(0.9); }
            10% { opacity: 1; transform: translateY(0) scale(1.05); }
            15% { transform: scale(1); }
            80% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-20px); }
        }

        /* МЕДИА СЮРПРИЗЫ */
        .reveal-media { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 100px; height: 100px; z-index: 10000; opacity: 0; 
            transition: all 1s ease-in-out; border: 4px solid var(--gold); display: none; 
            background-color: #000; object-fit: contain; pointer-events: none; border-radius: 12px;
            box-shadow: 0 0 30px #000;
        }
        .reveal-media.expanded { width: 100vw; height: 100vh; opacity: 1; border-width: 0; border-radius: 0; }
    </style>
</head>
<body>

    <!-- ЭКРАН С МАТРИЦЕЙ И ТЕРМИНАЛОМ -->
    <div id="start-overlay">
        <canvas id="matrix-canvas"></canvas>
        <div class="overlay-content">
            <h1>Congrats Илья and Алиса<br>happy birthday</h1>
            <button id="start-btn" disabled onclick="startExperience()">Вперед (60)</button>
            <div id="terminal"></div>
        </div>
    </div>

    <!-- БЕГУЩАЯ СТРОКА (НА ВСЮ ШИРИНУ) -->
    <div id="marquee-container">
        <div class="marquee-text">С днем рождения, Алиса и Илья! Я вас люблю ❤️</div>
    </div>

    <audio id="audio" preload="auto"></audio>
    <img id="reveal-img-1" class="reveal-media" src="a1.jpg" loading="eager">
    <img id="reveal-img-2" class="reveal-media" src="a2.png" loading="eager">
    <video id="reveal-vid-3" class="reveal-media" src="bu.mp4" preload="auto"></video>

    <div class="lane-container" id="progress">
        <div class="lane-line"></div>
        <div class="checkpoint active"></div><div class="checkpoint"></div><div class="checkpoint"></div>
        <div class="checkpoint"></div><div class="checkpoint"></div><div class="checkpoint"></div>
        <div class="checkpoint"></div><div class="checkpoint"></div><div class="checkpoint"></div>
        <div class="checkpoint"></div>
        
        <div class="lock"></div>
        
        <!-- КАПИБАРА -->
        <div class="capybara-container capy-running" id="avatar-elf" style="left: 0%;">
            <div class="capybara">
                <div class="capybara-legs"></div>
            </div>
            <div class="tooltip">Капибара на чилле, фармит мид.</div>
        </div>
    </div>

    <div class="content" id="main-content">
        <div id="quiz-area"></div>
    </div>

    <script>
        /* === ЛОГИКА МАТРИЦЫ === */
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        const matrixChars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = [];
        for(let x = 0; x < columns; x++) drops[x] = 1;
        
        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0f0';
            ctx.font = fontSize + 'px monospace';
            for(let i = 0; i < drops.length; i++) {
                const text = matrixChars[Math.floor(Math.random() * matrixChars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if(drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        const matrixInterval = setInterval(drawMatrix, 33);

        /* === КЭШ === */
        const audio = document.getElementById('audio');
        const capybara = document.getElementById('avatar-elf');
        const marquee = document.getElementById('marquee-container');
        
        /* === ЛОГИКА ХАКЕРСКОГО ТЕРМИНАЛА === */
        const terminalLogs = [
            "[SYS] Инициализация тайного лобби...",
            "[SYS] Подключение к серверам Dota 2...",
            "[SYS] Анализ пинга... 999 мс. Играбельно.",
            "<span class='log-err'>[ERROR] Илья снова ферст-пикнул Techies. Команда пишет 'GG'.</span>",
            "[WAIT] Илья взял Оракла. Обещает спасать, но кидает False Promise на фуллового крипа.",
            "<span class='log-warn'>[OK] Алиса взяла Witch Doctor. Ситуация под контролем.</span>",
            "[WAIT] Брошен кокос! Летит... летит... отскок в лесного крипа. Классика.",
            "<span class='log-err'>[ERROR] Илья на Рубике украл Rot у Пуджа и забыл как выключить. Умер.</span>",
            "[SYS] Загрузка касочек... Эффективность хила 146%.",
            "<span class='log-err'>[ERROR] Илья заминировал Рошпит. Сервер лагает от количества бочек.</span>",
            "<span class='log-warn'>[INFO] Антон пытается затащить эту катку. Шансы: 3%.</span>",
            "[SYS] Поиск команды... Найдены 4 подпиваса.",
            "[WAIT] Алиса ставит Death Ward (WUB WUB WUB). Раздаются крики врагов.",
            "<span class='log-warn'>[INFO] Илья делает суицид в толпу врагов. Убил только себя.</span>",
            "[SYS] Илья кидает Purifying Flames в союзного керри и случайно добивает его.",
            "[WAIT] Илья ставит табличку 'Осторожно, мины'. Враги думают, что это блеф... Зря.",
            "[OK] Подключение к голосовому чату. Обнаружены неадекваты. Мут всех.",
            "[WAIT] Алиса хилит команду... Команда с криками убегает от хила.",
            "<span class='log-warn'>[SYS] Сканирование таверны... Там подозрительно много наших.</span>",
            "<span class='log-err'>[ERROR] Минёр в команде = игра на 2 часа. Заказывайте пиццу.</span>",
            "[SYS] Илья на Рубике украл Телепорт Фуриона и улетел на вражеский фонтан.",
            "[SYS] Вражеский керри наступил на красную мину. Минус нервы.",
            "[WAIT] Алиса спамит 'Look at it go!'. Мораль команды повышена.",
            "[SYS] Синхронизация общих воспоминаний...",
            "<span class='log-warn'>[OK] Взлом лобби завершен. Защита активна.</span>",
            "<span class='log-warn'>[SYS] Готовность 100%. Нажмите ВПЕРЕД, чтобы начать.</span>"
        ];
        
        const terminal = document.getElementById('terminal');
        let logIndex = 0;
        const logTimer = setInterval(() => {
            if (logIndex < terminalLogs.length) {
                const line = document.createElement('div');
                line.className = 'log-line';
                line.innerHTML = terminalLogs[logIndex];
                terminal.appendChild(line);
                terminal.scrollTop = terminal.scrollHeight;
                logIndex++;
            } else {
                clearInterval(logTimer);
            }
        }, 2200);

        /* === ТАЙМЕР СТАРТА === */
        let timeLeft = 60;
        const startBtn = document.getElementById('start-btn');
        const timerInterval = setInterval(() => {
            timeLeft--;
            startBtn.innerText = `Вперед (${timeLeft})`;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                startBtn.disabled = false;
                startBtn.innerText = "Вперед";
                startBtn.style.transform = "scale(1.1)";
            }
        }, 1000);

        /* === ОГРОМНЫЙ ПАК KILL FEED === */
        const killFeedTexts = [
            "<span style='color: var(--red);'>FIRST BLOOD!</span> Алиса застилила фраг у керри.",
            "<span style='color: var(--red);'>FIRST BLOOD!</span> Илья сделал суицид в лесных крипов.",
            "<span style='color: var(--gold);'>DOUBLE KILL!</span> Илья на Оракле добил своего керри.",
            "<span style='color: var(--gold);'>DOUBLE KILL!</span> Вард Алисы сделал больше фрагов, чем кор.",
            "<span style='color: var(--red);'>TRIPLE KILL!</span> Кокос Алисы бесконечно скачет по троим.",
            "<span style='color: #ffaa00;'>WICKED SICK!</span> Антон сгорел в войс-чат!",
            "<span style='color: #00ffff;'>MONSTER KILL!</span> Вражеский мидер разбивает шмотки.",
            "<span style='color: var(--purple);'>RAMPAGE!</span> Илья заминировал фонтан и взорвал всю команду!",
            "<span style='color: var(--purple);'>RAMPAGE!</span> Илья нажал одну кнопку. Минус 5.",
            "<span style='color: #ffaa00;'>GODLIKE!</span> Алиса выхилила тимейта с 1 ХП.",
            "<span style='color: #00ffff;'>HOLY SHIT!</span> Илья купил Рапиру на Минёра!",
            "<span style='color: #00ffff;'>HOLY SHIT!</span> Команда противника удалила Доту.",
            "<span style='color: var(--red);'>DOMINATING!</span> Алиса закинула кокос в Рошпит. Рошан в стане.",
            "<span style='color: #ffaa00;'>UNSTOPPABLE!</span> Илья ставит зеленую мину прямо в файте.",
            "<span style='color: var(--gold);'>MEGA KILL!</span> Антон купил гем, но умер через секунду.",
            "<span style='color: var(--red);'>OWNAGE!</span> Враги ливнули из-за мин в лесу.",
            "<span style='color: #ffaa00;'>GODLIKE!</span> Илья на Рубике поднял врага в телекинез и скинул на клиф.",
            "<span style='color: var(--red);'>DOMINATING!</span> Илья забыл купить телепорт.",
            "<span style='color: var(--gold);'>MEGA KILL!</span> Алиса спасла мидера от смерти, но он вернулся и умер.",
            "<span style='color: #00ffff;'>HOLY SHIT!</span> Илья (Oracle) спас врага своим ультом.",
            "<span style='color: var(--purple);'>RAMPAGE!</span> Кто-то спер Аегис. Угадайте кто.",
            "<span style='color: var(--red);'>FIRST BLOOD!</span> Минер взорвал сам себя на миду. Тактика!",
            "<span style='color: var(--gold);'>DOUBLE KILL!</span> Курьер убит. В нем была Рапира Антона.",
            "<span style='color: #00ffff;'>MONSTER KILL!</span> Алиса кидает каски прямо под фонтан врага.",
            "<span style='color: var(--purple);'>RAMPAGE!</span> Илья поставил 50 мин в одном кусте.",
            "<span style='color: #ffaa00;'>UNSTOPPABLE!</span> Антон фармит лес на 60-й минуте.",
            "<span style='color: var(--gold);'>MEGA KILL!</span> Вражеский Снайпер не выдержал и ливнул.",
            "<span style='color: var(--purple);'>RAMPAGE!</span> Алиса сделала Rampage одними касками.",
            "<span style='color: var(--red);'>FIRST BLOOD!</span> Илья: 'Я только кнопочку нажму...'",
            "<span style='color: #ffaa00;'>WICKED SICK!</span> Антон: 'Да я щас затащу, смотрите!'",
            "<span style='color: var(--gold);'>DOUBLE KILL!</span> Кто не спрятался — тот наступил на мину.",
            "<span style='color: #00ffff;'>HOLY SHIT!</span> Вард Алисы живет дольше, чем вся наша команда.",
            "<span style='color: var(--red);'>DOMINATING!</span> Илья украл Black Hole, но дал его в одного саппорта.",
            "<span style='color: #ffaa00;'>UNSTOPPABLE!</span> Антон пишет 'ez' после 80 минут пота.",
            "<span style='color: var(--gold);'>MEGA KILL!</span> Алиса просто спамит смех Witch Doctor-а.",
            "<span style='color: #00ffff;'>MONSTER KILL!</span> У Ильи 0 фрагов, но 100000 урона по героям."
        ];

        function spawnKillFeed() {
            const feed = document.createElement('div');
            feed.className = 'kill-feed';
            feed.innerHTML = killFeedTexts[Math.floor(Math.random() * killFeedTexts.length)];
            
            const zone = Math.floor(Math.random() * 4);
            let t, l;
            if (zone === 0) { t = Math.random() * 5 + 5; l = Math.random() * 40 + 10; } 
            else if (zone === 1) { t = Math.random() * 5 + 85; l = Math.random() * 40 + 10; } 
            else if (zone === 2) { t = Math.random() * 40 + 20; l = Math.random() * 5 + 2; } 
            else { t = Math.random() * 40 + 20; l = Math.random() * 5 + 65; } 
            
            feed.style.top = t + 'vh';
            feed.style.left = l + 'vw';
            
            document.body.appendChild(feed);
            feed.addEventListener('animationend', () => feed.remove());
        }

        /* === МУЗЫКА КАЖДЫЕ 50 СЕКУНД === */
        const playlist = ["Sun.mp3", "porno.mp3", "Bullet.mp3", "london.mp3", "ak47.mp3", "paparoach.mp3", "Gorillaz.mp3"];
        let currentTrack = 0;
        let isSpecialAudioPlaying = false; 

        // ИСПРАВЛЕНА ОШИБКА РАННЕГО ЗАПУСКА:
        // Таймер переключения музыки задается ТОЛЬКО после старта квеста (в функции startExperience)
        let musicFadeTimer;

        function changeTrackWithFade() {
            if (isSpecialAudioPlaying) return; 
            let fadeOut = setInterval(() => {
                if (audio.volume > 0.02) { audio.volume -= 0.02; } 
                else {
                    audio.volume = 0;
                    clearInterval(fadeOut);
                    currentTrack = (currentTrack + 1) % playlist.length;
                    audio.src = playlist[currentTrack];
                    audio.play();
                    let fadeIn = setInterval(() => {
                        if (audio.volume < 0.13) { audio.volume += 0.02; } 
                        else { audio.volume = 0.15; clearInterval(fadeIn); }
                    }, 100);
                }
            }, 100);
        }
        
        audio.addEventListener('ended', changeTrackWithFade);

        /* === ОГРОМНЫЕ ФОТО В ПОЕЗДЕ === */
        let currentPhotoIndex = 1;
        let isRandomPhotos = false;

        function spawnPhoto() {
            let i;
            if (!isRandomPhotos) {
                i = currentPhotoIndex++;
                if (currentPhotoIndex > 31) isRandomPhotos = true; 
            } else {
                i = Math.floor(Math.random() * 31) + 1;
            }

            const img = document.createElement('img');
            img.src = `p${i}.jpg`;
            img.className = 'falling-photo';
            
            img.style.top = (Math.random() * 40 + 10) + 'vh'; 
            
            document.body.appendChild(img);
            setTimeout(() => img.remove(), 35000); 
        }

        /* === ВОПРОСЫ === */
        let currentStep = 1;
        const quizData = [
            { q: "Кто озвучивает фразу 'я люблю когда гмом'?", a: ["анастасия", "настя", "настена"] },
            { q: "Как ты обычно с нами здороваешься, когда заходишь?", a: ["привет", "привет ребята", "привет, ребята"] },
            { q: "В каком году был первый матч Антона с Алисой?", a: ["2024"] },
            { q: "Вопрос 4", a: ["ответ4"] },
            { q: "Вопрос 5", a: ["ответ5"] },
            { q: "Вопрос 6", a: ["ответ6"] },
            { q: "Вопрос 7", a: ["ответ7"] },
            { q: "Вопрос 8", a: ["ответ8"] },
            { q: "Вопрос 9", a: ["ответ9"] },
            { q: "Вопрос 10", a: ["ответ10"] }
        ];

        const quizArea = document.getElementById('quiz-area');
        quizData.forEach((item, index) => {
            const stepDiv = document.createElement('div');
            stepDiv.className = 'step';
            stepDiv.id = 'step' + (index + 1);
            if(index === 0) stepDiv.classList.add('active');
            
            stepDiv.innerHTML = `
                <p>${item.q}</p>
                <input type="text" id="answer${index + 1}" placeholder="Ваш ответ..." 
                       onkeydown="if(event.key === 'Enter') checkAnswer(${index + 1})" autofocus>
                <button class="submit-btn" onclick="checkAnswer(${index + 1})">Проверить</button>
            `;
            quizArea.appendChild(stepDiv);
        });

        /* === СПОКОЙНЫЙ ОДНОТОННЫЙ АУДИО ВИЗУАЛИЗАТОР === */
        let audioCtx, analyser, dataArray;
        function initVisualizer() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioCtx.createMediaElementSource(audio);
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                visualizeLoop();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function visualizeLoop() {
            requestAnimationFrame(visualizeLoop);
            if (!analyser) return;
            analyser.getByteFrequencyData(dataArray);

            let deepBassAvg = (dataArray[1] + dataArray[2] + dataArray[3] + dataArray[4] + dataArray[5]) / 5; 
            let midBassAvg = 0;
            for(let i = 6; i <= 15; i++) midBassAvg += dataArray[i];
            midBassAvg /= 10;

            const activeStep = document.querySelector('.step.active');
            if (activeStep) {
                if (deepBassAvg < 15 && midBassAvg < 15) {
                    activeStep.style.boxShadow = `0 0 20px rgba(0,0,0,0.5)`;
                    activeStep.style.transform = `scale(1)`;
                    activeStep.style.borderColor = `#333`;
                } else {
                    const intensity = Math.pow(deepBassAvg / 255, 1.2); 
                    const midIntensity = Math.pow(midBassAvg / 255, 1.2);

                    const scale = 1 + (intensity * 0.03); 
                    
                    const coreGlow = 10 + (intensity * 20); 
                    const midGlow = 30 + (midIntensity * 40); 
                    const outerGlow = 60 + (intensity * 80); 

                    activeStep.style.boxShadow = `
                        0 0 ${coreGlow}px rgba(255, 235, 180, ${0.3 + intensity * 0.4}), 
                        0 0 ${midGlow}px rgba(229, 192, 123, ${0.2 + midIntensity * 0.4}), 
                        0 0 ${outerGlow}px rgba(229, 192, 123, ${0.1 + intensity * 0.3}),
                        inset 0 0 ${20 + intensity * 30}px rgba(229, 192, 123, ${0.1 + intensity * 0.2})
                    `;
                    activeStep.style.transform = `scale(${scale})`;
                    activeStep.style.borderColor = `rgba(229, 192, 123, ${0.4 + intensity})`;
                }
            }
        }

        /* === СТАРТ === */
        function startExperience() {
            clearInterval(matrixInterval);
            
            marquee.style.display = 'block';

            audio.volume = 0.15;
            audio.src = playlist[0]; // Явно задаем первый трек
            audio.play(); 
            initVisualizer();

            // ЗАПУСКАЕМ ТАЙМЕР СМЕНЫ ТРЕКОВ ТОЛЬКО СЕЙЧАС (50 сек)
            musicFadeTimer = setInterval(changeTrackWithFade, 50000);

            document.getElementById('start-overlay').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            
            setTimeout(() => document.getElementById('answer1').focus(), 100);
            
            setInterval(spawnPhoto, 5000); 
            setInterval(spawnKillFeed, 8000);
        }

        /* === УНИВЕРСАЛЬНЫЙ ОБРАБОТЧИК МЕДИА === */
        function playMediaEvent(mediaId, audioFile, duration = null) {
            isSpecialAudioPlaying = true;
            audio.pause();

            const media = document.getElementById(mediaId);
            let specialAudio = null;

            if (audioFile) {
                specialAudio = new Audio(audioFile);
                specialAudio.play();
            } else if (media.tagName === 'VIDEO') {
                media.play();
            }

            media.style.display = 'block';
            setTimeout(() => media.classList.add('expanded'), 50);

            const onEnd = () => {
                if (specialAudio) { specialAudio.pause(); specialAudio.currentTime = 0; }
                if (media.tagName === 'VIDEO') { media.pause(); media.currentTime = 0; }
                
                media.classList.remove('expanded');
                setTimeout(() => { media.style.display = 'none'; }, 1000); 
                
                audio.volume = 0.15;
                audio.play();
                isSpecialAudioPlaying = false;
                nextStep();
            };

            if (duration) {
                setTimeout(onEnd, duration);
            } else if (specialAudio) {
                specialAudio.onended = onEnd;
            } else if (media.tagName === 'VIDEO') {
                media.onended = onEnd;
            }
        }

        /* === ПРОВЕРКА ОТВЕТА === */
        async function checkAnswer(step) {
            if (isSpecialAudioPlaying) return; 

            const inputField = document.getElementById('answer' + step);
            const submitBtn = inputField.nextElementSibling;
            const val = inputField.value.toLowerCase().trim();
            
            if (quizData[step-1].a.includes(val)) {
                inputField.classList.add('success-glow');
                inputField.disabled = true;
                submitBtn.disabled = true;
                
                setTimeout(() => {
                    inputField.value = ''; 
                    inputField.classList.remove('success-glow');
                    inputField.disabled = false;
                    submitBtn.disabled = false;

                    if (step === 1) {
                        playMediaEvent('reveal-img-1', 'gol.mp3');
                    } else if (step === 2) {
                        playMediaEvent('reveal-img-2', 'Privet.mp3', 4000); 
                    } else if (step === 3) {
                        playMediaEvent('reveal-vid-3', null);
                    } else {
                        nextStep();
                    }
                }, 300);
            } else { 
                inputField.classList.add('shake');
                setTimeout(() => inputField.classList.remove('shake'), 400);
            }
        }

        /* === ПЕРЕХОД НА СЛЕДУЮЩИЙ ШАГ === */
        function nextStep() {
            const oldStep = document.getElementById('step' + currentStep);
            oldStep.style.display = 'none';
            oldStep.classList.remove('active'); 
            
            currentStep++;
            
            if (currentStep <= 10) {
                const newStep = document.getElementById('step' + currentStep);
                newStep.classList.add('active'); 
                
                setTimeout(() => document.getElementById('answer' + currentStep).focus(), 100);
                
                const pos = (currentStep - 1) * 10;
                
                capybara.classList.add('capy-jump');
                capybara.style.left = pos + '%';
                
                setTimeout(() => {
                    capybara.classList.remove('capy-jump');
                }, 800);
                
                const flags = document.querySelectorAll('.checkpoint');
                flags[currentStep - 1].classList.add('active');
            } else {
                capybara.classList.add('capy-jump');
                capybara.style.left = '100%';
                
                setTimeout(() => {
                    capybara.classList.remove('capy-jump');
                    alert("GG WP! Защита снята. Код: 732");
                }, 800);
            }
        }
    </script>
</body>
